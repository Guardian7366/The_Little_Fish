io de Handy","doodle":"Handy","doodleFile":"dibujos/10-handy.png","startMs":76500,"endMs":84500,"beat":"Refugio de Handy. El pez golpea un cerrojo con Rocky, con la animación del equipo original.","lyrics":["And yet something inside him","Still beat so strongly.","His resolve and the courage to go on","Stayed with him and kept him alive,","Because he simply wanted to live."]},{"id":"ic","zone":"Refugio de Ic","doodle":"Ic","doodleFile":"dibujos/11-ic.png","startMs":84500,"endMs":95500,"beat":"Refugio de Ic. El pez se desliza hasta una marca y se detiene en la piedra rugosa.","lyrics":["I wanted a good life,","A life filled with happiness.","I wanted things to get better.","And you were there beside me.","You watched me grow.","You watched me suffer.","You watched me laugh."]},{"id":"planta","zone":"Primera zona de Planta","doodle":"Planta","doodleFile":"dibujos/12-planta.png","startMs":95500,"endMs":103500,"beat":"Templo de la séptima zona. Planta señala y extiende una liana. El pez sale del carril antes del contacto.","lyrics":["You were always there","When I felt low.","I'll never forget anything about you.","I'll never forget what you meant to me.","I'll never forget my memories of you."]},{"id":"tv","zone":"TV Supply","doodle":"TV","doodleFile":"dibujos/13-tv.png","startMs":103500,"endMs":112500,"beat":"Mercado. El pez se acerca al mostrador y TV enciende su pantalla. La toma mantiene la vista en el mercado.","lyrics":["Thank you for being here.","I promise I'll keep","The promise I made to you so long ago.","I'll honor your name.","I'll honor your memory,","Because I loved you so much."]},{"id":"god-fish","zone":"Arena de God Fish","doodle":"God Fish","doodleFile":"dibujos/14-god-fish.png","startMs":112500,"endMs":118500,"beat":"Fosa final. Mostrar la pose de aviso y un barrido claro de God Fish, con el pez a distancia. Cerrar con el ojo visible.","lyrics":["I'll never forget…","Everything you were to me…","And the first time I met you…"]}]}, scenes=[{"tiles":[ const $=id=>document.getElementById(id),ctx=document.querySelector('canvas').getContext('2d'),im=new Map();
function load(path){if(!im.has(path)){const i=new Image;i.src='sprites/'+path;im.set(path,i)}return im.get(path)}
function draw(path,x,y,w,h){const i=load(path);if(i.complete&&i.naturalWidth)ctx.drawImage(i,Math.round(x),Math.round(y),w,h)}
function bossDraw(path,attack,frame,x,y,w){const i=load(path);if(i.complete&&i.naturalWidth)ctx.drawImage(i,frame*144,attack?128:0,144,128,x,y,w,Math.round(w*128/144))}
for(const s of scenes)for(const p of [...s.tiles,...s.actors,...(s.props||[]),...(s.extra||[]),...fish])load(p);
timeline.cards.forEach((c,i)=>{$('jump').add(new Option((i+1)+'. '+c.zone,c.startMs/1000+.32))});$('jump').add(new Option('Despedida',122));
let clock=0,run=false,last=performance.now(),active=-2;
const limit=(n,a,b)=>Math.max(a,Math.min(b,n)),ease=t=>t*t*(3-2*t);
function scene(i,t){const s=scenes[i],p=limit(t,0,1),tick=Math.floor(t*24)%2;
 ctx.imageSmoothingEnabled=false;ctx.fillStyle='#111322';ctx.fillRect(0,0,240,192);
 for(let row=0;row<12;row++)for(let col=0;col<15;col++){
  const edge=row===0||row===11||col===0||col===14||(i===3&&row===5&&(col===5||col===9));
  draw(s.tiles[edge?2:(row*3+col*7)%5===0?1:0],col*16,row*16,16,16);
 }
 const behavior=i===4||i===7||i===8||i===11||i===13, cue=behavior&&p>.37&&p<.64, impact=behavior&&p>=.64&&p<.76;
 let fx=25+145*ease(limit(p*1.38,0,1)),fy=126+(i===10?0:Math.sin(p*3.3)*9);
 if(behavior&&p>.43){fx=25+145*ease(.43*1.38)+28*ease(limit((p-.43)*2.5,0,1));fy=126+Math.sin(.43*3.3)*9+20*ease(limit((p-.48)*4,0,1))}
 if(i===9)fx=Math.min(fx,122);
 if(i===3){ctx.fillStyle='#f1ab8b';ctx.fillRect(202-Math.floor(p*171),111,5,4);}
 if(i===8){const ax=173-109*ease(limit((p-.64)/.12,0,1));draw(s.actors[impact?2:tick],ax,107,36,26)}
 else if(s.boss)bossDraw(s.actors[cue||impact?1:0],cue||impact,cue?0:impact?1:tick,76,26,105);
 else if(i===0)draw(s.actors[tick],165-60*Math.sin(p*Math.PI),106,16,16);
 else if(i===4)draw(s.actors[impact?2:tick],151-35*ease(p),73,22,22);
 else draw(s.actors[(i===12?p>.42:tick)?1:0],i===11?127:161,i===11?65:58,s.size,s.size);
 if(s.extra)draw(s.extra[i===7?Number(impact):tick],126-20*Math.sin(p*Math.PI),102,19,19);
 if(s.props?.length&&i!==11){
  if(i===12)draw(s.props[0],144,86,69,23);
  else draw(s.props[p>.53?1:0]||s.props[0],113,96,i===10?18:24,i===10?18:24);
 }
 if(i===6&&p>.36){ctx.fillStyle='#a6d5fa';for(let k=0;k<Math.min(3,1+Math.floor((p-.36)*8));k++)ctx.fillRect(135+k*14,125-k*7,3,3)}
 if(cue){ctx.fillStyle='#f9c98a59';ctx.fillRect(i===8?25:113,112,i===8?165:26,i===8?17:44)}
 if(i===11&&impact){for(let k=0;k<3;k++)draw(s.props[k===2?1:0],130,87+k*15,16,16)}
 draw(fish[i===7&&cue?3:i===9&&p>.55&&p<.72?4:tick],fx,fy,17,17);
}
function render(){const ms=clock*1000,c=timeline.cards.findIndex(x=>ms>=x.startMs&&ms<x.endMs),ending=clock>=120;
 $('title').classList.toggle('hidden',clock>=4);$('cards').classList.toggle('hidden',c<0&&!(!ending&&clock>=118.5));$('end').classList.toggle('hidden',!ending);
 let alpha=0;
 if(c>=0){const item=timeline.cards[c];if(c!==active){$('lyric').textContent=item.lyrics.join('\n');$('drawing').src='../'+item.doodleFile;$('jump').value=String(item.startMs/1000+.32);active=c}scene(c,(ms-item.startMs)/(item.endMs-item.startMs));if(c===0)alpha=Math.max(0,1-(clock-4)/.32);}
 if(clock>=3.68&&clock<4)alpha=(clock-3.68)/.32;
 if(clock>=118.5&&clock<120){if(active!==13){$('lyric').textContent=timeline.cards[13].lyrics.join('\n');$('drawing').src='../'+timeline.cards[13].doodleFile;scene(13,1);active=13}alpha=(clock-118.5)/1.5}
 if(ending)alpha=1-limit((clock-120)/1.7,0,1);
 $('veil').style.opacity=String(alpha);$('seek').value=clock;$('time').textContent=clock.toFixed(1)+' s';$('play').textContent=run?'Pausar':'Reproducir';
}
function frame(now){if(run){clock=Math.min(122,clock+(now-last)/1000);if(clock>=122)run=false;render()}last=now;requestAnimationFrame(frame)}
$('play').onclick=()=>{if(clock>=122)clock=0;run=!run;render()};$('seek').oninput=e=>{clock=Number(e.target.value);run=false;render()};$('jump').onchange=e=>{clock=Number(e.target.value);run=false;render()};$('again').onclick=()=>{clock=0;run=true;render()};render();requestAnimationFrame(frame);
