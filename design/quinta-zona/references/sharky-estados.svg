<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" fill="#17152b"/><style>text{font-family:Arial,sans-serif;fill:#e7def5;font-size:19px}</style><text x="35" y="45" font-size="28">Sharky: señales y estados</text><rect x="35" y="100" width="320" height="90" rx="9" fill="#393052" stroke="#8b7caf"/><text x="50" y="132">ACECHO</text><text x="50" y="165" style="font-size:16px">Lento y visible</text><rect x="380" y="100" width="320" height="90" rx="9" fill="#393052" stroke="#8b7caf"/><text x="395" y="132">PREPARACIÓN</text><text x="395" y="165" style="font-size:16px">Burbujas / fija rumbo al final</text><rect x="740" y="100" width="320" height="90" rx="9" fill="#393052" stroke="#8b7caf"/><text x="755" y="132">EMBESTIDA</text><text x="755" y="165" style="font-size:16px">Recta / un impacto máximo</text><rect x="740" y="290" width="320" height="90" rx="9" fill="#393052" stroke="#8b7caf"/><text x="755" y="322">RECUPERACIÓN</text><text x="755" y="355" style="font-size:16px">Choque: aturdimiento más largo</text><rect x="380" y="290" width="320" height="90" rx="9" fill="#393052" stroke="#8b7caf"/><text x="395" y="322">REGRESO</text><text x="395" y="355" style="font-size:16px">Sin curación / respeta paredes</text><path d="M 355 145 H 380 M 700 145 H 740 M 900 190 V 290 M 740 335 H 700 M 380 335 H 195 V 190" fill="none" stroke="#a4a1cf" stroke-width="3"/><text x="35" y="460">Ver la señal → esquivar o defenderse → castigar el fallo.</text><text x="35" y="500" style="font-size:16px">No gira en la pasada. Parry interrumpe. Pausa y diálogos congelan los estados.</text></svg>