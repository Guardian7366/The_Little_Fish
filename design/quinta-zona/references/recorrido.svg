<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840"><rect width="100%" height="100%" fill="#17152b"/><style>text{font-family:Arial,sans-serif;fill:#e7def5} .label{font-size:18px} .small{font-size:14px}</style><text x="35" y="40" font-size="26">Quinta zona · flujo propuesto</text><text x="35" y="66" class="small">Esquema de conexiones, no geometría final. Mantener mapa interno 3.</text><rect x="390" y="110" width="310" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="404" y="140" class="label">A · Refugio central</text><text x="404" y="164" class="small">Llegada (25,23) / descanso (25,20)</text><rect x="780" y="110" width="300" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="794" y="140" class="label">B · Presentación de Sharky</text><text x="794" y="164" class="small">Un tiburón, cámara amplia y luz</text><rect x="390" y="260" width="310" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="404" y="290" class="label">C · Bifurcación</text><text x="404" y="314" class="small">Dos brazos y vuelta reconocible</text><rect x="45" y="260" width="280" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="59" y="290" class="label">Puerta original de Iron</text><text x="59" y="314" class="small">Entrada (9,5), sin bloqueo Iron</text><rect x="45" y="410" width="280" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="59" y="440" class="label">D · Prueba de hierro</text><text x="59" y="464" class="small">Luz, calma y primer bloque</text><rect x="390" y="410" width="310" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="404" y="440" class="label">E · Circuito intermedio</text><text x="404" y="464" class="small">Atajo al refugio / combates separados</text><rect x="780" y="410" width="300" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="794" y="440" class="label">Desvío opcional</text><text x="794" y="464" class="small">Picarón y exploración</text><rect x="45" y="570" width="280" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="59" y="600" class="label">Puerta de arma original</text><text x="59" y="624" class="small">Entrada (14,40), cofre conservado</text><rect x="390" y="570" width="310" height="82" rx="10" fill="#393052" stroke="#8b7caf"/><text x="404" y="600" class="label">F · Cámara final</text><text x="404" y="624" class="small">Dos Sharkys, ataques escalonados</text><rect x="390" y="720" width="310" height="70" rx="10" fill="#393052" stroke="#8b7caf"/><text x="404" y="750" class="label">Salida (9,44)</text><text x="404" y="774" class="small">Continúa a la zona siguiente</text><path d="M 700 151 L 780 151" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 930 192 L 930 235" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 930 235 L 545 235" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 545 235 L 545 260" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 390 301 L 325 301" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 185 342 L 185 410" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 325 451 L 390 451" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 545 342 L 545 410" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 700 451 L 780 451" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 545 492 L 545 570" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 390 611 L 325 611" stroke="#a4a1cf" stroke-width="3" fill="none"/><path d="M 545 652 L 545 720" stroke="#a4a1cf" stroke-width="3" fill="none"/><text x="755" y="305" class="small">Mayoría Sharkys: 6</text><text x="755" y="329" class="small">Picarones: 3, con territorios</text><text x="755" y="353" class="small">Luz fija + linterna útil</text></svg>